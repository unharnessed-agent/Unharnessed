# Keeps catalog/models.additions.v1.json current: the models a provider
# released that the model catalog does not list yet, which the client adds
# to its picker (crates/uh-models/src/additions.rs). Every hour,
# scripts/sync-model-additions.py compares models.dev and the Codex CLI's
# model list with the catalog and this job commits the file when it changed. A run that cannot read a
# source fails and leaves the file as it is.
#
# Unlike ci.yml this workflow writes: it pushes that one file to main.
#
name: model-additions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-additions
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Sync the additions with their sources and the catalog
        run: python3 scripts/sync-model-additions.py | tee "$RUNNER_TEMP/report.txt"
      - name: Commit the file when it changed
        run: |
          file=catalog/models.additions.v1.json
          if [ -z "$(git status --porcelain -- "$file")" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          {
            echo "The model additions follow models.dev"
            echo
            grep -E '^(added|removed) ' "$RUNNER_TEMP/report.txt" || true
          } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push
