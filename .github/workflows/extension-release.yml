# Releases the VS Code extension, and the terminal's archives with it.
#
# A pushed tag vscode-v<version> builds the .vsix of macOS, Linux and Windows
# (vscode/scripts/package.mjs), publishes them to the VS Code Marketplace
# and attaches them to a GitHub release. The tag must name the version of
# vscode/package.json.
#
# The same agent is archived for the terminal
# (scripts/unharnessed-package.sh): unharnessed-<target>.tar.gz and its
# .sha256, attached to the same release, which install.sh downloads (on
# Windows, install.ps1). Each archive is installed on its runner before it
# is kept.
#
# Run by hand (workflow_dispatch) it is a rehearsal: the same files are
# built and kept as artifacts of the run, and nothing is published.
#
# The Marketplace takes the .vsix files through Trusted Publishing: the
# publisher `Unharnessed` trusts this workflow (marketplace.visualstudio.com
# /manage > Trusted Publishing: owner unharnessed-agent, repository
# Unharnessed, workflow extension-release.yml), so no token is kept. It
# comes after the GitHub release, which a refused publication leaves whole.
#
name: extension-release

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      # A rehearsal shows every platform that fails, not the first one.
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            rust: aarch64-apple-darwin
            runs-on: macos-15
          # Cross-built on Apple silicon.
          - target: darwin-x64
            rust: x86_64-apple-darwin
            runs-on: macos-15
          - target: linux-x64
            rust: x86_64-unknown-linux-musl
            runs-on: ubuntu-24.04
          - target: linux-arm64
            rust: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
          - target: win32-x64
            rust: x86_64-pc-windows-msvc
            runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The tag names the extension's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          if [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but vscode/package.json is version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.rust }}
      # The musl targets build ring's C code with musl-gcc.
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the extension's dependencies
        working-directory: vscode
        run: npm ci
      - name: Build the .vsix
        working-directory: vscode
        run: node scripts/package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vsix-${{ matrix.target }}
          path: vscode/*.vsix
          if-no-files-found: error
      # The agent is built already: this archives it with what ships beside it
      # (in Git Bash on Windows).
      - name: Build the terminal's archive
        shell: bash
        run: scripts/unharnessed-package.sh ${{ matrix.target }} terminal
      # darwin-x64 is cross-built: its runner would ask for the darwin-arm64 archive.
      - name: Install the archive, and ask the installed agent its version
        if: runner.os != 'Windows' && matrix.target != 'darwin-x64'
        run: |
          UNHARNESSED_INSTALL_FROM="$PWD/terminal" sh install.sh --no-kernel
          version=$(node -p "require('./vscode/package.json').version")
          said=$("$HOME/.local/bin/unharnessed" --version)
          if [ "$said" != "$version" ]; then
            echo "::error::the installed agent says version $said, vscode/package.json is $version"
            exit 1
          fi
      # In Windows PowerShell 5.1, which `irm ... | iex` runs in on a fresh Windows.
      - name: Install the archive with install.ps1, and ask the installed agent its version
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:UNHARNESSED_INSTALL_FROM = "$PWD\terminal"
          .\install.ps1 -NoKernel
          if ($LASTEXITCODE) { exit 1 }
          $version = node -p "require('./vscode/package.json').version"
          $current = "$env:LOCALAPPDATA\unharnessed\current"
          $said = & "$current\unharnessed.exe" --version
          if ($said -ne $version) {
            Write-Output "::error::the installed agent says version $said, vscode/package.json is $version"
            exit 1
          }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $current) {
            Write-Output "::error::install.ps1 did not put $current on the user PATH"
            exit 1
          }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: terminal-${{ matrix.target }}
          path: terminal/unharnessed-*
          if-no-files-found: error

  publish:
    name: publish
    # Only a tag publishes, and only when every platform built.
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # The workflow's identity, which the Marketplace trusts.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: terminal-*
          merge-multiple: true
          path: terminal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Attach the .vsix files and the terminal's archives to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" vsix/*.vsix terminal/unharnessed-* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" vsix/*.vsix terminal/unharnessed-* --repo "$GITHUB_REPOSITORY" \
              --title "Unharnessed Agent ${GITHUB_REF_NAME#vscode-v}" --generate-notes
          fi
      # --skip-duplicate: a rerun after a partial publication publishes the rest.
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath vsix/*.vsix
